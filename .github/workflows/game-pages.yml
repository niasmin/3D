name: Test and publish Samkok 3D
on:
  push:
    branches: [main]
    paths: ['samkok/**', '.github/workflows/game-pages.yml']
  pull_request:
    paths: ['samkok/**', '.github/workflows/game-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: samkok-3d-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: samkok/package-lock.json
      - run: npm ci
        working-directory: samkok
      - run: npm test
        working-directory: samkok
      - run: npm run build
        working-directory: samkok
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: samkok/web
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
