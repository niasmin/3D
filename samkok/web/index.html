function shrinePull(n){
  const id=S.shrinePick; if(!id) return toast('เลือกขุนพลก่อน');
  if(S.tickets<n) return toast('ตั๋วทะลวงไม่พอ ผ่านหอท้าขุนพลหรือแลกด้วยหยก');
  S.tickets-=n;
  const out={soul:0,copy:0,gold:0,exp:0};
  for(let i=0;i<n;i++){
    S.shrinePity++;
    const r=rng(); let k = r<0.05?'soul': r<0.30?'copy': r<0.65?'gold':'exp';
    if(S.shrinePity>=10) k='soul';
    if(k==='soul'){out.soul++; S.shrinePity=0}
    else if(k==='copy') out.copy++;
    else if(k==='gold') out.gold+=3000+S.stage*100;
    else out.exp+=2000+S.stage*80;
  }
  let fresh=false;
  if(out.copy>0 && !H(id)){ S.heroes[id]={lv:1,star:1,copies:0,aw:0,eq:{}}; out.copy--; fresh=true }
  if(H(id)) H(id).copies+=out.copy; else out.lost=out.copy;
  S.souls[id]=(S.souls[id]||0)+out.soul; S.gold+=out.gold; S.exp+=out.exp + (out.lost||0)*1500;
  save(); render();
  const nm=esc(HERO[id].th);
  $('#layer').innerHTML=`<div class="reveal" role="dialog" aria-label="ผลการทะลวง">
    <div class="h" style="margin:0">ผลการทะลวง ${n} ครั้ง</div>
    <div class="loot-list">
      ${out.soul?`<span class="hot"><i class="coin t"></i>ผลึกจิตแดง ${nm} ×${out.soul}</span>`:''}
      ${fresh?`<span class="hot">ได้รับขุนพล ${nm}!</span>`:''}
      ${out.copy?`<span>สำเนา ${nm} ×${out.copy}</span>`:''}
      ${out.lost?`<span>สำเนา ×${out.lost} แปลงเป็น EXP</span>`:''}
      ${out.gold?`<span><i class="coin g"></i>+${fmt(out.gold)}</span>`:''}
      ${out.exp?`<span><i class="coin x"></i>+${fmt(out.exp)}</span>`:''}
    </div>
    <div style="display:flex;gap:10px"><button class="btn" data-act="close">รับทราบ</button>${S.tickets>=n?`<button class="btn ghost" data-act="sh${n}">อีก ${n} ครั้ง</button>`:''}</div>
  </div>`;
}

const CELEB_Q=[]; let celebOn=false;
const CELEB_KIND={hero:{t:'ได้รับขุนพลใหม่!', c:'#ffd36a'}, star:{t:'เลื่อนดาวสำเร็จ!', c:'#ffe066'}, awaken:{t:'ตื่นจิตสำเร็จ!', c:'#ff8af0'}, evolve:{t:'วิวัฒน์ร่างใหม่!', c:'#9affd6'},

function celebrate(kind, id, sub){ CELEB_Q.push({kind,id,sub}); if(!celebOn) nextCeleb() }
function nextCeleb(){

      <b class="ctitle">${k.t}</b>${h?`<span class="cname">${esc(h.th)} <em>${RAR[h.rar].label}</em></span>`:''}${c.sub?`<span class="csub">${esc(c.sub)}</span>`:''}
      <small>แตะเพื่อดำเนินต่อ</small></div>`;
  const close=()=>{ if(!el.isConnected) return; el.classList.add('out'); setTimeout(()=>{ el.remove(); nextCeleb() },250) };

// ---------- actions ----------
function doPull(n){
  const free = n===1 && S.freeDate!==today();
  const cost = n===10?2700:300;
  if(!free && S.gems<cost) return toast('หยกไม่พอ ผ่านด่านหรือทำภารกิจเพื่อรับเพิ่ม');
  if(free) S.freeDate=today(); else S.gems-=cost;
  const got=[];
  for(let i=0;i<n;i++){
    S.pulls++; S.pityS++; S.pitySP++;
    const r=rng(); let rar = r<0.03?'SP': r<0.23?'S':'A';
    if(S.pitySP>=60) rar='SP'; else if(S.pityS>=10 && rar==='A') rar='S';
    if(rar!=='A') S.pityS=0; if(rar==='SP') S.pitySP=0;
    const pool=HEROES.filter(h=>h.rar===rar); let h=pool[Math.floor(rng()*pool.length)];
    if(rar==='SP' && curEvent().k==='rateup' && rng()<0.5) h=HERO[featuredSP()];
    const isNew=!S.heroes[h.id];
    if(isNew) S.heroes[h.id]={lv:1,star:1,copies:0,aw:0,eq:{}}; else S.heroes[h.id].copies++;
    got.push({id:h.id,isNew});
  }
  S.daily.pull+=n; addEv(5*n); save(); render();
  setTimeout(()=>sfx(got.some(g=>HERO[g.id].rar==='SP')?'sp':'pull'),120);
  $('#layer').innerHTML=`<div class="reveal" role="dialog" aria-label="ผลการอัญเชิญ">
    <div class="h" style="margin:0">ผลการอัญเชิญ</div>
    <div class="grid" style="${n===1?'grid-template-columns:minmax(0,120px);justify-content:center':''}">${got.map((g,i)=>cardHTML(g.id,{team:false,force:true,lv:S.heroes[g.id].lv,star:S.heroes[g.id].star,extra:g.isNew?'<span class="tagnew">ใหม่!</span>':'<span class="tagdup">+1 สำเนา</span>'}).replace('class="card','style="animation-delay:'+(i*0.08)+'s" class="card')).join('')}</div>
    <div style="display:flex;gap:10px"><button class="btn" data-act="close">รับทราบ</button>${S.gems>=cost?`<button class="btn ghost" data-act="${n===10?'pull10':'pull1'}">อีก ${n} ครั้ง</button>`:''}</div>
  </div>`;
  got.filter(g=>g.isNew&&HERO[g.id].rar==='SP').forEach((g,i)=>setTimeout(()=>celebrate('hero', g.id, 'อัญเชิญได้ขุนพล S+!'), 1100+i*50));
}

function autoTeam(quiet){
  const team=S.team.map(id=>id&&isLocked(id)?id:null);
  const owned=Object.keys(S.heroes).filter(id=>!team.includes(id)).sort((a,b)=>heroPower(b)-heroPower(a));
  const fronters=owned.filter(id=>['war','cav'].includes(HERO[id].role));
  let fi=0; for(let i=0;i<3;i++) if(!team[i] && fronters[fi]) team[i]=fronters[fi++];
  const rest=owned.filter(id=>!team.includes(id));
  let k=0; for(let i=0;i<6;i++){ if(!team[i] && rest[k]) team[i]=rest[k++] }
  S.team=team; save(); if(quiet) return; render(); toast('จัดทัพจากขุนพลที่แรงที่สุดแล้ว');
}

function toggleTeam(id){
  const i=S.team.indexOf(id);
  if(i>=0){ if(S.team.filter(Boolean).length<=1) return toast('ทัพต้องมีขุนพลอย่างน้อย 1 คน'); S.team[i]=null }
  else {
    const prefFront=['war','cav'].includes(HERO[id].role);
    const order=prefFront?[0,1,2,3,4,5]:[3,4,5,0,1,2];
    const free=order.find(j=>!S.team[j]);
    if(free===undefined) return toast('ทัพเต็ม 6 คนแล้ว ถอนใครออกก่อน');
    S.team[free]=id;
  }
  save(); render(); openHero(id);
}

// Battlefield art: stages cycle village -> fortress gate -> harbour by region; arena is the harbour, tower and guild boss the gate.
const BF_CYCLE=['village','gate','harbor'];
const stageBg = stage => BF_CYCLE[regionOf(stage)%BF_CYCLE.length];
const bfOf = kind => kind==='arena'?'harbor' : kind==='tower'||kind==='raid'?'gate' : stageBg(S.stage);
// Scene light shared by the background and everyone standing in it: a colour grade and vignette laid over
// both, drifting particles, and per-scene rim light / shadow direction set through CSS variables (.sc-*).
const SCENE_PART={village:'leaf', gate:'ember', harbor:'ember'};
const sceneFX = sc => `<div class="sgrade" aria-hidden="true"></div><div class="svig" aria-hidden="true"></div><div class="amb ${SCENE_PART[sc]||'dust'}" aria-hidden="true">${Array.from({length:14},(_,i)=>`<i style="--i:${i};--x:${(i*53)%100}%;--d:${(i*37)%10/10}"></i>`).join('')}</div>`;
function battleBg(kind){
  return `<div class="bfbg bpic bf-${kind} bg-${bfOf(kind)}" aria-hidden="true"></div>`;
}
function fx(el, cls){
  if(!el) return; const f=document.createElement('span'); f.className='fx '+cls; el.appendChild(f); setTimeout(()=>f.remove(),700);
}
function fly(fromEl, toEl, cls, ms){
  const field=$('.field'); if(!field||!fromEl||!toEl) return;
  const fr=field.getBoundingClientRect(), a=fromEl.getBoundingClientRect(), b=toEl.getBoundingClientRect();
  const x0=a.left+a.width/2-fr.left, y0=a.top+a.height/3-fr.top, x1=b.left+b.width/2-fr.left, y1=b.top+b.height/3-fr.top;
  const p=document.createElement('span'); p.className='proj '+cls; field.appendChild(p);
  const ang=Math.atan2(y1-y0,x1-x0)*180/Math.PI;
  if(p.animate) p.animate([{transform:`translate(${x0}px,${y0}px) rotate(${ang}deg)`},{transform:`translate(${x1}px,${y1}px) rotate(${ang}deg)`}],{duration:ms,easing:'ease-in'});
  setTimeout(()=>p.remove(),ms);
}
function applyHits(a, animate){
  window.Samkok3D?.hits(a);

  const star=Object.keys(S.heroes).find(id=>{const h=H(id), c=starCost(h.star); return h.star<5&&h.copies>=c.copies});

  const capped=ids.find(id=>H(id).lv>=levelCap(H(id).star,H(id).aw)); if(capped) tips.push(`${HERO[capped].th} เลเวลเต็มแล้ว ต้องเลื่อนดาวก่อน`);
  const facs={}; ids.forEach(id=>facs[HERO[id].fac]=(facs[HERO[id].fac]||0)+1); const top=Object.entries(facs).sort((a,b)=>b[1]-a[1])[0];
  if(top && top[1]===2) tips.push(`มี${FAC[top[0]].th} 2 คน เพิ่มอีก 1 คนได้โบนัสก๊ก +6%`);
  if(S.gold<5000) tips.push('เงินใกล้หมด เก็บรางวัลออฟไลน์และทำภารกิจรายวัน');

}

function quickFight(mode, bot){

  skip(); const win=B.res.winner==='p'; clearTimeout(B.timer); B.done=true; closeLayer(); return win;

function doDaily(){
  if(UI.autoplay) return toast('หยุดออโต้ก่อน');
  UI.quiet=true; const before=snap(), lines=[];
  try{
    if(afkNow().mins>=1){ const r=afkNow(); S.gold+=r.gold; S.exp+=r.exp; S.gems+=r.gems; S.potions+=Math.floor(r.mins/120); S.afkSince=Date.now(); S.daily.afk++; lines.push('เก็บรางวัลออฟไลน์') }
    let lg=0; LOGIN7.forEach((r,i)=>{ if(i<S.login.days && !S.login.got.includes(i)){ S.login.got.push(i); if(r.gems) S.gems+=r.gems; if(r.tickets) S.tickets+=r.tickets; if(r.gold) S.gold+=r.gold; if(r.fish) S.fishPts+=r.fish; if(r.exp) S.exp+=r.exp; if(r.chest) S.bag.selSP=(S.bag.selSP||0)+1; lg++ } });
    if(lg) lines.push(`รับรางวัล 7 วัน ${lg} รายการ`);
    if(S.freeDate!==today()){ doPull(1); closeLayer(); lines.push('อัญเชิญฟรี 1 ครั้ง') }
    let tw=0; while(S.train.left>0){ if(quickFight('train')) tw++ } if(tw||S.train.left===0) lines.push(`ฝึกฝน ชนะ ${tw}/3`);
    let aw=0, an=0; while(S.arena.left>0 && an<5){ const opp=arenaOpps().map(b=>({b,p:botTeam(b,S.arena.pts,avgTeamLv(),S.arena.ref).reduce((a,x)=>a+power(x.id,x.lv,x.star),0)})).sort((x,y)=>x.p-y.p)[0]; if(!opp) break; an++; if(quickFight('arena',opp.b)) aw++ }
    if(an) lines.push(`ประลอง ชนะ ${aw}/${an}`);
    if(S.guild.id!==null){ if(!S.guild.checked){ S.guild.checked=true; S.gems+=100; S.friend+=20; S.guild.coins+=100; guildExp(50); lines.push('เช็กอินกิลด์') }
      let r=0; while(S.guild.raid>0 && r<3){ quickFight('raid'); r++ } if(r) lines.push(`ตีบอสกิลด์ ${r} ครั้ง`) }
    let fc=0; while(S.fishing.casts>0 && fc<20){ cast(); if(fishG){ fishG.pos=fishG.zone+fishG.w/2; pull() } fc++ } if(fc) lines.push(`ตกปลา ${fc} ครั้ง`);
    let tk=0; for(const t of TASKS) if(taskDone(t)&&!S.daily.got[t.k]){ S.daily.got[t.k]=1; S.gems+=t.gems; tk++ }
    if(allDone()&&!S.daily.got.all){ S.daily.got.all=1; S.gems+=300; tk++ } if(tk) lines.push(`รับรางวัลภารกิจ ${tk} รายการ`);
  } finally { UI.quiet=false; fishMsg=''; setMusic('city') }
  save(); render();
  const ap={before, t0:Date.now(), lvups:0, pulls:0};
  showAutoReport(ap, lines.length?lines.join(' · '):'วันนี้ทำครบแล้ว');
  const h=$('.apreport h2'); if(h) h.textContent='สรุปงานประจำวัน';
}
// ---------- away catch-up: battles that would have happened while the game was closed ----------
function markAway(){ if(UI.autoplay){ S.autoAway={mode:UI.autoplay.mode, since:Date.now()}; save() } }
function catchUp(){
  const aw=S.autoAway; if(!aw) return; delete S.autoAway;
  const mins=(Date.now()-aw.since)/60e3, n=Math.min(120, Math.floor(mins*1.5));
  if(n<1){ save(); return }
  UI.quiet=true; const ap={mode:aw.mode, before:snap(), t0:aw.since, lvups:0, pulls:0}; let loss=0, done=0;
  UI.autoplay={...ap, wins:0, loss:0, stuck:{}};
  try{ for(let i=0;i<n && loss<3;i++){ autoPrep(); const w=quickFight(aw.mode); done++; if(w) loss=0; else loss++; if(goalReached()) break } }
  finally{ ap.lvups=UI.autoplay.lvups; UI.autoplay=null; UI.quiet=false; setMusic('city') }
  save(); render(); showAutoReport(ap, `ระหว่างปิดเกม ${Math.round(mins)} นาที ทัพสู้ไป ${done} ครั้ง${loss>=3?' แล้วติด':''}`);
}

  }catch(e){}
}

        UI.ask=null; S=migrate(d); save(); render(); toast('โหลดเกมจากรหัสแล้ว'); return }
      case 'afk': { sfx('coin'); const r=afkNow(); S.gold+=r.gold; S.exp+=r.exp; S.gems+=r.gems; S.potions+=Math.floor(r.mins/120); S.afkSince=Date.now(); S.daily.afk++; save(); render(); toast(`เก็บแล้ว เงิน +${fmt(r.gold)} · EXP +${fmt(r.exp)}${r.gems?` · หยก +${r.gems}`:''}`); return }
      case 'fight': fight(); return;
      case 'autosk': S.autoSkill=S.autoSkill===false; save(); act.setAttribute('aria-pressed',S.autoSkill); act.querySelector('b').textContent=S.autoSkill?'ON':'OFF';
        { const h=$('#skHint'); if(h) h.textContent=S.autoSkill?'ขุนพลใช้สกิลเองเมื่อพลังโกรธเต็ม':'พลังโกรธเต็มแล้วแตะ "ใช้สกิล" หรือแตะรูปขุนพลที่เรืองแสง' }
        if(S.autoSkill && B && B.wait) { fireSkill() } return;
      case 'useskill': if(B && B.wait) fireSkill(); return;
      case 'speed': B.speed=B.speed===1?2:B.speed===2?4:1; act.textContent='x'+B.speed; if(UI.autoplay){ apCfg().speed=B.speed; save() } return;
      case 'skip': skip(); return;
      case 'endbattle': endBattle(); return;
      case 'next': { const md=B?.mode||'stage'; if(B){clearTimeout(B.timer)} fight(md); return }
      case 'fighttower': fight('tower'); return;
      case 'arenafight': { if(act.dataset.uid){ const p=realPlayers().find(x=>x.uid===act.dataset.uid); if(!p) return;
          fight('arena', {real:true, uid:p.uid, name:pname(p.uid), pts:+p.pts||0, team:p.team}); return }
        fight('arena', BOTS[+act.dataset.bot]); return }
      case 'chatch': chatCh=act.dataset.c; render(); return;
      case 'arenaref': S.arena.ref++; save(); render(); return;
      case 'arenaclaim': { if(S.arena.claimed) return; const g=arenaRankReward(arenaRank()); S.gems+=g; S.arena.claimed=true; save(); render(); toast(`รับหยก ${g} จากอันดับ ${arenaRank()}`); return }
      case 'beastup': { const k=act.dataset.k, lv=S.beasts[k]||0, c=beastCost(lv); if(lv>=BEAST_MAX||S.fishPts<c.fish||S.gold<c.gold) return;
        S.fishPts-=c.fish; S.gold-=c.gold; S.beasts[k]=lv+1; save(); render(); toast(`${BEASTS.find(b=>b.k===k).th} Lv.${lv+1}`); return }
      case 'cast': cast(); return;
      case 'pull': pull(); return;
      case 'loginclaim': { const i=+act.dataset.i, r=LOGIN7[i]; if(i>=S.login.days||S.login.got.includes(i)) return; S.login.got.push(i);
        if(r.gems) S.gems+=r.gems; if(r.tickets) S.tickets+=r.tickets; if(r.gold) S.gold+=r.gold; if(r.fish) S.fishPts+=r.fish; if(r.exp) S.exp+=r.exp; if(r.chest) S.bag.selSP=(S.bag.selSP||0)+r.chest;
        save(); render(); toast(`รับของขวัญวันที่ ${i+1} แล้ว`); return }
      case 'buy': buy(act.dataset.k); return;
      case 'salvage': { const uid=+act.dataset.uid, g=gearById(uid); if(!g||gearOwner(uid)) return; S.gold+=salvageValue(g); S.gear=S.gear.filter(x=>x.uid!==uid); save(); render(); return }
      case 'salvagelow': { let sum=0; S.gear=S.gear.filter(g=>{ if(g.q<=1 && !gearOwner(g.uid)){sum+=salvageValue(g);return false} return true }); S.gold+=sum; save(); render(); toast(`แยกชิ้นส่วนได้เงิน +${fmt(sum)}`); return }
      case 'gearslot': openGearSlot(id, act.dataset.slot); return;
      case 'equip': equip(id, +act.dataset.uid); save(); render(); openHero(id); return;
      case 'unequip': delete H(id).eq[act.dataset.slot]; save(); render(); openHero(id); return;
      case 'autogear': autoGear(id); save(); render(); openHero(id); toast('สวมอุปกรณ์ที่ดีที่สุดแล้ว'); return;
      case 'ungear': H(id).eq={}; save(); render(); openHero(id); return;
      case 'enh': { const g=gearById(+act.dataset.uid), c=enhCost(g); if(g.enh>=GEAR_MAX_ENH||S.gold<c) return; S.gold-=c; g.enh++; save(); render(); openGearSlot(id, g.slot); return }
      case 'hero': openHero(id); return;
      case 'storygo': openDialogue(+act.dataset.c, +act.dataset.s); return;
      case 'dlgnext': dlgNext(); return;
      case 'dlgskip': { const d=DLG; DLG=null; if(d) fight('story',{c:d.c, s:d.si}); return }
      case 'mech': { const h=H(id); if(h.aw<3) return; h.mech=!h.mech; save(); render(); openHero(id); toast(h.mech?`${HERO[id].th} แปลงร่างจักรกลแล้ว`:'กลับร่างปกติแล้ว'); return }
      case 'gjoin': S.guild={...S.guild, id:+act.dataset.i, lv:1, exp:0, coins:0}; save(); render(); toast(`เข้าร่วม ${GUILDS[S.guild.id].name} แล้ว`); return;
      case 'gleave': S.guild={...S.guild, id:null}; save(); render(); return;
      case 'gcheck': if(S.guild.checked) return; S.guild.checked=true; S.gems+=100; S.friend+=20; S.guild.coins+=100; guildExp(50); save(); render(); toast('เช็กอินกิลด์แล้ว'); return;
      case 'raid': fight('raid'); return;
      case 'gbuy': { const it=GSHOP.find(x=>x.k===act.dataset.k); if(S.guild.coins<it.cost) return; S.guild.coins-=it.cost;
        if(it.give.tickets) S.tickets+=it.give.tickets; if(it.give.fish) S.fishPts+=it.give.fish; if(it.give.chest) S.bag.selSP=(S.bag.selSP||0)+1;
        save(); render(); toast(`แลก ${it.th} แล้ว`); return }
      case 'shrinepick': openShrinePicker(); return;
      case 'shpick': S.shrinePick=id; save(); closeLayer(); render(); return;
      case 'sh1': closeLayer(); shrinePull(1); return;
      case 'sh10': closeLayer(); shrinePull(10); return;
      case 'buyticket': if(S.gems<200) return; S.gems-=200; S.tickets++; save(); render(); toast('แลกตั๋วทะลวง 1 ใบแล้ว'); return;
      case 'region': { const i=+act.dataset.i; toast(i<regionOf(S.stage)?`แคว้น${REGIONS[i%REGIONS.length].n} พิชิตแล้ว`:`กำลังบุกแคว้น${REGIONS[i%REGIONS.length].n}`); return }
      case 'assistpick': { const o=ASSIST_OPTS&&ASSIST_OPTS[+act.dataset.i]; if(!o||S.assist.uses<1) return; S.assist.pick=o.e; save(); render(); toast(`ยืม ${HERO[o.e.id].th} มาช่วยสู้แล้ว`); return }
      case 'assistclear': S.assist.pick=null; save(); render(); return;
      case 'train': fight('train'); return;
      case 'trial': closeLayer(); fight('trial',{id}); return;
      case 'lvall': { let n=0, moved=true; const ids=S.team.filter(Boolean); while(moved && n<300){ moved=false; for(const id of ids){ if(levelUp(id,1)){ n++; moved=true } } }
        save(); render(); toast(n?`เลื่อนระดับรวม ${n} ครั้ง`:'เงินหรือ EXP ไม่พอ'); return }
      case 'gearall': S.team.filter(Boolean).forEach(autoGear); save(); render(); toast('สวมอุปกรณ์ที่ดีที่สุดให้ทั้งทัพแล้ว'); return;
      case 'evclaim': { if(S.evw.claimed||new Date().getDay()!==0) return; const r=evBoard().findIndex(x=>x.me)+1, rw=evReward(r); S.gems+=rw.gems; if(rw.chest) S.bag.selSP=(S.bag.selSP||0)+1; S.evw.claimed=true; save(); render(); toast(`อันดับ ${r}: หยก +${rw.gems}${rw.chest?' และหีบเลือก S+':''}`); return }
      case 'potion': { if(!S.potions) return; const n=S.potions; S.exp+=n*POTION_EXP; S.potions=0; sfx('coin'); save(); render(); toast(`ใช้ยา EXP ${n} ขวด ได้ EXP +${fmt(n*POTION_EXP)}`); return }
      case 'fbuy': { const it=FSHOP.find(x=>x.k===act.dataset.k); if(!it||S.friend<it.cost) return; S.friend-=it.cost; sfx('coin');
        if(it.give.potions) S.potions+=it.give.potions; if(it.give.tickets) S.tickets+=it.give.tickets; if(it.give.casts) S.fishing.casts+=it.give.casts;
        let msg=`แลก ${it.th} แล้ว`;
        if(it.give.shards){ const pool=HEROES.filter(h=>h.rar===it.give.rar), sh=pool[Math.floor(rng()*pool.length)]; addShards(sh.id,it.give.shards); msg=`ได้เศษ${sh.th} ×${it.give.shards}` }
        save(); render(); toast(msg); return }
      case 'shard': { const h=HERO[id], own=!!H(id), need=SHARD_NEED[h.rar][own?'own':'neu']; if((S.shards[id]||0)<need) return;
        S.shards[id]-=need; if(own) H(id).copies++; else { S.heroes[id]={lv:1,star:1,copies:0,aw:0,eq:{}}; placeInTeam(id) }
        save(); render(); if(own) toast(`ได้สำเนา ${h.th} +1`); else celebrate('hero', id, 'รวมเศษขุนพลครบแล้ว'); return }
      case 'tutskip': S.tut=99; save(); render(); return;
      case 'tutnext': S.tut++; save(); render(); return;
      case 'opensel': selPick=null; openSelector(); return;
      case 'selpick': selPick=id; openSelector(); return;
      case 'selconfirm': { if(!selPick||!(S.bag.selSP>0)) return; S.bag.selSP--; if(!S.bag.selSP) delete S.bag.selSP;
        const had=!!H(selPick); if(had) H(selPick).copies++; else S.heroes[selPick]={lv:1,star:1,copies:0,aw:0,eq:{}};
        save(); closeLayer(); render(); if(had) toast(`ได้สำเนา ${HERO[selPick].th} +1`); else celebrate('hero', selPick, 'จากหีบเลือกขุนพล S+'); return }
      case 'awaken': { const h=H(id), c=awCost(h.aw); if(h.star<5||h.aw>=5||(S.souls[id]||0)<c.soul||S.gold<c.gold) return;
        const t0=evoTier(id,h.aw); S.souls[id]-=c.soul; S.gold-=c.gold; h.aw++; save(); render(); openHero(id); celebrate('awaken', id, `ตื่นจิตขั้น ${h.aw} · เลเวลสูงสุด ${levelCap(h.star,h.aw)}`);
        if(evoTier(id,h.aw)>t0){ const e=EVO[id][evoTier(id,h.aw)-1]; celebrate('evolve', id, `ร่าง${e[0]} · สกิล ${e[1]}`) } return }
      case 'pull1': closeLayer(); doPull(1); return;
      case 'pull10': closeLayer(); doPull(10); return;
      case 'showall': roster.showAll=!roster.showAll; render(); return;
      case 'autoteam': autoTeam(); return;
      case 'pickslot': tab='heroes'; render(); return;
      case 'toggleteam': toggleTeam(id); return;
      case 'lvup': case 'lvup10': { const n=levelUp(id, a==='lvup10'?10:1); if(!n) return; save(); render(); openHero(id); if(n>1) toast(`+${n} เลเวล`); return }
      case 'starup': { const h=S.heroes[id], c=starCost(h.star); if(h.star>=5||h.copies<c.copies||S.gold<c.gold) return; S.gold-=c.gold; h.copies-=c.copies; h.star++; save(); render(); openHero(id); celebrate('star', id, `${'★'.repeat(h.star)} · เลเวลสูงสุด ${levelCap(h.star,h.aw)}`); return }
      case 'task': { const k=act.dataset.k, t=TASKS.find(x=>x.k===k); const gems=k==='all'?300:t.gems; if(S.daily.got[k]) return; if(k==='all'?!allDone():!taskDone(t)) return; S.daily.got[k]=1; S.gems+=gems; save(); render(); toast(`ได้รับหยก +${gems}`); return }
      case 'reset': $('#layer').innerHTML=`<div class="veil" data-act="close"><div class="sheet" data-stop role="dialog" aria-modal="true" aria-label="เริ่มเกมใหม่">
          <h2>เริ่มเกมใหม่?</h2><p>ขุนพล เงิน หยก และด่านทั้งหมดจะหายไป ย้อนกลับไม่ได้</p>
          <div class="actions"><button class="btn ghost" style="color:var(--on-parch)" data-act="close">ยกเลิก</button><button class="btn red" data-act="reset-yes">ลบและเริ่มใหม่</button></div></div></div>`; return;
      case 'reset-yes': S=newGame(); save(); closeLayer(); tab='city'; render(); toast('เริ่มเกมใหม่แล้ว'); return;
    }
  }
  const card=e.target.closest('[data-hero]'); if(card && !e.target.closest('.reveal')){ openHero(card.dataset.hero); return }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ roster.q=e.target.value; const pos=e.target.selectionStart; render(); const q=$('#q'); q.focus(); try{q.setSelectionRange(pos,pos)}catch(_){} }
});
document.addEventListener('submit',e=>{ if(e.target.id==='chatform'){ e.preventDefault(); sendChat() } });
document.addEventListener('input',e=>{ if(e.target.id==='chatin') chatDraft=e.target.value });
document.addEventListener('change',e=>{ if(e.target.id==='sort'){roster.sort=e.target.value; render()} });
document.addEventListener('keydown',e=>{ if(e.key==="Escape" && !$(".battle")) closeLayer() });

// AFK ticker + scene loot sparkle
setInterval(()=>{
  if(tab!=='camp') return;
  const a=afkNow(), t=$('#afkT'); if(!t) return;
  t.textContent=hms(a.mins); $('#afkG').textContent=fmt(a.gold); $('#afkX').textContent=fmt(a.exp); $('#afkJ').textContent=a.gems;
  const btn=$('[data-act="afk"]'); if(btn) btn.disabled=a.mins<1;
},1000);
setInterval(()=>{
  const sc=$('#scene'); if(!sc||document.hidden) return;
  const l=document.createElement('span'); l.className='loot'; l.textContent='+'+(20+S.stage*5);
  l.style.left=(30+Math.random()*40)+'%'; l.style.bottom=(30+Math.random()*10)+'%'; sc.appendChild(l); setTimeout(()=>l.remove(),1600);
},2500);

function boot(){
  const el=$('#boot'); if(!el||typeof Image==='undefined') { el?.remove?.(); return }
  const list=['ui/city2.webp','ui/avatar.webp',...['city','heroes','team','train','camp'].map(k=>`ui/n-${k}.webp`),...['tasks','login','bag','more'].map(k=>`ui/q-${k}.webp`),`ui/bf-${stageBg(S.stage)}.webp`,...S.team.filter(Boolean).filter(id=>ART.has(id)).map(id=>`art/${id}.webp`)];
  let n=0; const done=()=>{ el.classList.add('gone'); setTimeout(()=>el.remove(),450) };
  const tick=()=>{ n++; const b=$('#bootbar'); if(b) b.style.width=Math.round(n/list.length*100)+'%'; if(n>=list.length) done() };
  list.forEach(src=>{ const im=new Image(); im.onload=im.onerror=tick; im.src=src });
  setTimeout(done,6000);
}
document.addEventListener('pointermove',e=>{
  const c=e.target.closest?.('[data-tilt]'); if(!c) return;
  const r=c.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
  c.style.setProperty('--rx',(-y*18).toFixed(1)+'deg'); c.style.setProperty('--ry',(x*22).toFixed(1)+'deg');
  c.style.setProperty('--gx',((x+.5)*100).toFixed(0)+'%'); c.style.setProperty('--gy',((y+.5)*100).toFixed(0)+'%');
});
document.addEventListener('pointerout',e=>{ const c=e.target.closest?.('[data-tilt]'); if(c&&!c.contains(e.relatedTarget)){ c.style.removeProperty('--rx'); c.style.removeProperty('--ry') } });
// ---------- dim mode: auto follows the phone's dark setting ----------
const DIM_KEY='kp-dim';
function dimPref(){ try{ return localStorage.getItem(DIM_KEY)||'auto' }catch(e){ return 'auto' } }
function applyDim(){ const p=dimPref(), dark=p==='on'||(p==='auto'&&window.matchMedia?.('(prefers-color-scheme: dark)').matches);
  document.documentElement?.classList?.toggle('dim', !!dark); const b=$('#dimbtn'); if(b){ b.setAttribute('aria-pressed',!!dark); b.title=`โหมดลดแสง: ${{auto:'อัตโนมัติ',on:'เปิด',off:'ปิด'}[p]}` } }
try{ window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change',applyDim) }catch(e){}
document.addEventListener('change',e=>{ const el=e.target.closest?.('[data-apsel]'); if(!el) return; apCfg()[el.dataset.apsel]=isNaN(+el.value)?el.value:+el.value; save() });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) markAway(); else if(S&&S.autoAway&&UI.autoplay){ delete S.autoAway; save() } });
window.addEventListener?.('pagehide',markAway);
window.SamkokGame={
  state:()=>S, tab:()=>tab, hero:id=>HERO[id], heroes:()=>HEROES,
  evolution:(id,aw)=>evoTier(id,aw), enemies:()=>enemyTeam(S.stage),
  biome:()=>stageBg(S.stage), battle:()=>document.querySelector('.battle')?B:null,
  toast, navigate:key=>{tab=key;closeLayer();render()},
};
function start(data){ load(data); applyDim(); render(); if(S.autoAway) setTimeout(catchUp, 600); boot(); initNet(); const sb=$('#sndbtn'); if(sb){ sb.classList.toggle('off',!SND.on); sb.setAttribute('aria-pressed',SND.on) }
  // browsers only allow audio after a tap, so a saved 'on' waits for the first one
  if(SND.on){ SND.on=false; document.addEventListener('pointerdown',e=>{ if(!SND.ctx && !e.target.closest('#sndbtn')) toggleSound() },{once:true}) } }
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
</script>
